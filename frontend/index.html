<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07090d" />
    <meta
      name="description"
      content="CYBEROS — the cybersecurity operating platform where every action passes scope, decision, grant and broker before it executes."
    />
    <title>CYBEROS — Authorized security operations, proven</title>
    <script>
      try {
        var t = localStorage.getItem('cyberos.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
